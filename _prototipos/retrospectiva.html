<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alyssom Fernandes · Retrospectiva 2021–2026</title>
<meta name="description" content="A carreira de Alyssom Fernandes contada em stories: de 5 anos de DP/RH a sistemas em produção. Developer · Data & Business Intelligence.">
<meta name="theme-color" content="#0D0826">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ================================================================
   RETROSPECTIVA — protótipo de conceito
   Todos os fatos/números ficam no objeto DATA (script, topo).
   ================================================================ */
@property --deep { syntax: '<color>'; inherits: true; initial-value: #0D0826; }
@property --c1   { syntax: '<color>'; inherits: true; initial-value: #FF5B3A; }
@property --c2   { syntax: '<color>'; inherits: true; initial-value: #FFC94A; }
@property --hfg  { syntax: '<color>'; inherits: true; initial-value: #F7EFE3; }

:root{
  --deep:#0D0826; --c1:#FF5B3A; --c2:#FFC94A; --hfg:#F7EFE3;
  --cream:#F7EFE3; --ink:#16121F; --indigo:#1E1452; --tomato:#FF5B3A; --mustard:#FFC94A;
  --cobalt:#3A36FF; --pink:#FF9BD2; --plum:#2B0D35; --paper:#F4ECDF;
  --f-display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
  --f-mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-io:cubic-bezier(.7,0,.2,1);
  transition: --deep .9s ease, --c1 .9s ease, --c2 .9s ease;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{
  background:var(--deep); color:var(--cream);
  font-family:var(--f-display); font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden; overscroll-behavior:none;
}
a{ color:inherit; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
:focus-visible{ outline:2px solid var(--mustard); outline-offset:3px; border-radius:8px; }

/* ---------------- Fundo animado (desktop) ---------------- */
.bg{ position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
.blob{ position:absolute; border-radius:50%; will-change:transform; }
.b1{ width:75vmax; height:75vmax; left:-22vmax; top:-30vmax; background:radial-gradient(closest-side, var(--c1), transparent); opacity:.5; animation:drift1 21s ease-in-out infinite alternate; }
.b2{ width:65vmax; height:65vmax; right:-24vmax; bottom:-30vmax; background:radial-gradient(closest-side, var(--c2), transparent); opacity:.38; animation:drift2 26s ease-in-out infinite alternate; }
.b3{ width:40vmax; height:40vmax; left:38vw; top:30vh; background:radial-gradient(closest-side, var(--c1), transparent); opacity:.18; animation:drift3 17s ease-in-out infinite alternate; }
@keyframes drift1{ to{ transform:translate3d(18vw,14vh,0) scale(1.15); } }
@keyframes drift2{ to{ transform:translate3d(-16vw,-12vh,0) scale(.9); } }
@keyframes drift3{ to{ transform:translate3d(-24vw,18vh,0) scale(1.3); } }
.dots{ position:absolute; inset:0; background-image:radial-gradient(color-mix(in srgb, var(--cream) 14%, transparent) 1px, transparent 1.2px); background-size:28px 28px; mask-image:radial-gradient(ellipse at center, #000 20%, transparent 75%); opacity:.55; }
.bg-word{ position:absolute; left:0; right:0; bottom:-3.2vw; white-space:nowrap; transition:opacity .35s ease; }
.bg-word.swap{ opacity:0; }
.bg-word-track{ display:inline-flex; animation:marquee 60s linear infinite; will-change:transform; }
.bg-word-track span{
  font-weight:800; font-stretch:75%; font-size:23vw; line-height:1; letter-spacing:-.02em; padding-right:.3em;
  color:transparent; -webkit-text-stroke:1.5px color-mix(in srgb, var(--cream) 16%, transparent);
}
@keyframes marquee{ to{ transform:translate3d(-50%,0,0); } }
.grain{ position:fixed; inset:-50%; z-index:3; pointer-events:none; opacity:.07; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1.2s steps(4) infinite; }
@keyframes grain{ 0%{transform:translate(0,0)} 25%{transform:translate(-3%,2%)} 50%{transform:translate(2%,-3%)} 75%{transform:translate(-2%,-1%)} 100%{transform:translate(0,0)} }

/* ---------------- Página ---------------- */
.page{
  position:relative; z-index:2; height:100vh; height:100dvh;
  display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center;
  gap:clamp(24px,4vw,72px); padding:0 clamp(24px,4.4vw,80px);
}
.card{
  position:relative; height:min(calc(100dvh - 56px), 920px); aspect-ratio:9/16;
  border-radius:30px; overflow:hidden; container-type:size;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.65), 0 0 0 1px color-mix(in srgb, var(--cream) 14%, transparent);
  isolation:isolate; transform:translateZ(0);
}

/* ---------------- Painéis laterais (desktop) ---------------- */
.panel{ align-self:stretch; display:flex; flex-direction:column; justify-content:center; min-width:0; }
.panel-l{ align-items:flex-start; }
.panel-r{ align-items:flex-end; text-align:right; }
.eyebrow{ font-family:var(--f-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; }
.pl-top{ display:flex; align-items:center; gap:12px; margin-bottom:28px; }
.mono-badge{ width:44px; height:44px; border-radius:50%; display:grid; place-items:center; flex:none;
  font-weight:800; font-size:15px; letter-spacing:-.02em; color:var(--ink);
  background:conic-gradient(from 200deg, #FF5B3A, #FFC94A, #FF9BD2, #FF5B3A); }
.pl-name{ margin:0; font-weight:800; font-stretch:78%; font-size:clamp(44px,4.6vw,76px); line-height:.9; letter-spacing:-.025em; }
.pl-title{ margin:18px 0 0; font-size:clamp(16px,1.25vw,19px); font-weight:500; opacity:.92; }
.pl-thesis{ margin:26px 0 0; max-width:30ch; font-family:var(--f-serif); font-style:italic; font-size:clamp(19px,1.55vw,24px); line-height:1.25; opacity:.85; }
.avail{ display:flex; gap:12px; align-items:flex-start; margin-top:26px; font-size:15px; line-height:1.45; max-width:44ch; }
.avail span{ opacity:.72; font-size:.92em; }
.live{ position:relative; flex:none; width:10px; height:10px; margin-top:6px; border-radius:50%; background:#7CF0B0; }
.live::after{ content:''; position:absolute; inset:-5px; border-radius:50%; border:2px solid #7CF0B0; animation:ping 1.8s var(--ease-out) infinite; }
@keyframes ping{ from{ transform:scale(.4); opacity:1; } to{ transform:scale(1.6); opacity:0; } }
.pl-cta{ display:flex; gap:10px; flex-wrap:wrap; margin-top:30px; }
.pl-links{ list-style:none; margin:22px 0 0; padding:0; display:flex; gap:18px; flex-wrap:wrap; font-size:14px; }
.pl-links a{ text-decoration:none; opacity:.78; border-bottom:1px solid color-mix(in srgb, var(--cream) 35%, transparent); padding-bottom:2px; transition:opacity .2s; }
.pl-links a:hover{ opacity:1; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 22px; border-radius:999px;
  font-weight:650; font-size:15px; letter-spacing:-.005em; text-decoration:none; white-space:nowrap;
  transition:transform .25s var(--ease-out), background-color .25s, color .25s; }
.btn:hover{ transform:translateY(-2px); }
.btn:active{ transform:scale(.97); }
.btn svg{ width:17px; height:17px; flex:none; }
.btn small{ font-family:var(--f-mono); font-size:10.5px; font-weight:600; letter-spacing:.06em; opacity:.7; }
.btn-cream{ background:var(--cream); color:var(--ink); }
.btn-line{ box-shadow:inset 0 0 0 1.5px color-mix(in srgb, currentColor 55%, transparent); }

.chapters{ list-style:none; margin:18px 0 0; padding:0; display:flex; flex-direction:column; gap:2px; }
.chapters button{ display:grid; grid-template-columns:auto auto; justify-content:end; align-items:center; column-gap:14px; padding:7px 0; text-align:right;
  font-size:clamp(17px,1.5vw,22px); font-weight:600; letter-spacing:-.01em; opacity:.42; transition:opacity .3s, transform .4s var(--ease-out); }
.chapters button:hover{ opacity:.8; }
.chapters .num{ font-family:var(--f-mono); font-size:11px; font-weight:600; letter-spacing:.08em; }
.chapters .cbar{ grid-column:1 / -1; justify-self:end; width:0; height:2px; margin-top:6px; background:color-mix(in srgb, var(--cream) 22%, transparent); overflow:hidden; transition:width .5s var(--ease-out); }
.chapters .cbar i{ display:block; height:100%; background:var(--c2); transform-origin:0 50%; transform:scaleX(0); }
.chapters li.on button{ opacity:1; transform:translateX(-6px); }
.chapters li.on .cbar{ width:100%; }
.hint{ margin-top:36px; font-size:13.5px; line-height:1.9; opacity:.7; max-width:30ch; }
.hint kbd{ display:inline-grid; place-items:center; min-width:28px; height:26px; padding:0 7px; margin:0 2px; border-radius:7px; font-family:var(--f-mono); font-size:12px;
  background:color-mix(in srgb, var(--cream) 10%, transparent); box-shadow:inset 0 -2px 0 color-mix(in srgb, var(--cream) 18%, transparent); }

/* ---------------- Story ---------------- */
.story{ position:absolute; inset:0; --u:min(1cqw, .5cqh); }
.slides{ position:absolute; inset:0; touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; cursor:pointer; }
.slide{ position:absolute; inset:0; overflow:hidden; visibility:hidden; background:var(--bg); color:var(--fg); }
.slide.current{ visibility:visible; z-index:2; }
.slide.leaving{ visibility:visible; z-index:1; }
.slide.current.enter{ animation:reveal .85s var(--ease-io) both; }
@keyframes reveal{ from{ clip-path:circle(0% at var(--ox,50%) var(--oy,50%)); } to{ clip-path:circle(150% at var(--ox,50%) var(--oy,50%)); } }
.slide.leaving > .content, .slide.leaving > .deco{ animation:out .7s var(--ease-io) both; }
@keyframes out{ to{ transform:scale(.92); opacity:.25; } }
.story.paused .play, .story.paused .play *{ animation-play-state:paused !important; }

.content{ position:absolute; inset:0; z-index:2; display:flex; flex-direction:column;
  padding:calc(86px + 2.2cqh) 7cqw calc(4.5cqh + env(safe-area-inset-bottom)); }
.deco{ position:absolute; inset:0; z-index:1; pointer-events:none; }

.s-eyebrow{ font-family:var(--f-mono); font-size:max(11px, calc(2.7 * var(--u))); font-weight:600; letter-spacing:.14em; text-transform:uppercase; margin:0; display:flex; gap:.8em; align-items:center; }
.s-eyebrow::before{ content:''; width:1.8em; height:2px; background:currentColor; }
.big{ font-weight:800; font-stretch:76%; line-height:.8; letter-spacing:-.045em; margin:0; font-variant-numeric:tabular-nums; }
.h2{ margin:0; font-weight:750; font-stretch:82%; font-size:calc(9.4 * var(--u)); line-height:.95; letter-spacing:-.03em; }
.serif{ font-family:var(--f-serif); font-style:italic; font-weight:400; letter-spacing:0; }
.p{ margin:0; font-size:max(14px, calc(3.75 * var(--u))); line-height:1.42; }
.small{ font-size:max(12.5px, calc(3.15 * var(--u))); line-height:1.45; }
.accent{ color:var(--a1); }
.chip{ display:inline-flex; align-items:center; min-height:26px; padding:0 .8em; border-radius:999px; font-family:var(--f-mono); font-size:max(11px, calc(2.6 * var(--u))); font-weight:600; letter-spacing:.02em;
  box-shadow:inset 0 0 0 1.2px color-mix(in srgb, currentColor 40%, transparent); white-space:nowrap; }
.tag-ilustrativo{ font-family:var(--f-mono); font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; padding:3px 8px; border-radius:6px; background:color-mix(in srgb, var(--fg) 10%, transparent); }

/* reveal genérico */
.rv{ opacity:1; }
.play .rv{ animation:rise .95s var(--ease-out) calc(.2s + var(--d,0s)) both; }
@keyframes rise{ from{ opacity:0; transform:translate3d(0,26px,0); } }
.play .fade{ animation:fadeIn .8s ease calc(.2s + var(--d,0s)) both; }
@keyframes fadeIn{ from{ opacity:0; } }

/* tipografia cinética */
.kt .w{ display:inline-block; overflow:hidden; vertical-align:bottom; padding:.1em .03em .16em; margin:-.1em -.03em -.16em; }
.kt .ch{ display:inline-block; transform-origin:0 100%; }
.play .kt .ch{ animation:chIn 1s var(--ease-out) calc(.15s + var(--d,0s) + var(--ci) * 30ms) both; }
@keyframes chIn{ from{ transform:translate3d(0,112%,0) rotate(14deg); } }

/* números que se montam (odômetro) */
.odo{ display:inline-flex; }
.odo-d{ display:inline-block; height:1em; overflow:hidden; line-height:1em; }
.odo-reel{ display:block; transform:translateY(calc(var(--n) * -1em)); }
.odo-reel span{ display:block; height:1em; line-height:1em; text-align:center; }
.play .odo-reel{ animation:roll 1.7s cubic-bezier(.2,.85,.1,1) calc(.25s + var(--d,0s) + var(--k) * .13s) both; }
@keyframes roll{ from{ transform:translateY(calc(var(--f) * -1em)); } }
.odo-s{ display:inline-block; }
.big .odo{ gap:.02em; }
.play .odo-s{ animation:pop .8s cubic-bezier(.3,1.7,.5,1) calc(1.1s + var(--d,0s)) both; }
@keyframes pop{ from{ transform:scale(0) rotate(-60deg); opacity:0; } }

/* ---------------- Cabeçalho do story ---------------- */
.hdr{ position:absolute; inset:0 0 auto; z-index:30; padding:12px 14px 0; color:var(--hfg); transition:--hfg .6s ease; pointer-events:none; }
.hdr::before{ content:''; position:absolute; inset:0 0 -34px; background:linear-gradient(to bottom, color-mix(in srgb, var(--hbg, #000) 55%, transparent), transparent); opacity:.55; z-index:-1; transition:background .6s; }
.bars{ display:flex; gap:4px; pointer-events:auto; }
.bar{ flex:1; height:3px; border-radius:3px; background:color-mix(in srgb, var(--hfg) 28%, transparent); overflow:hidden; }
.bar i{ display:block; height:100%; background:var(--hfg); transform-origin:0 50%; transform:scaleX(0); }
.hrow{ display:flex; align-items:center; gap:10px; margin-top:12px; pointer-events:auto; }
.hid{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
.hid .mono-badge{ width:36px; height:36px; font-size:13px; }
.hid b{ display:block; font-size:14px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hid > div > span{ display:block; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.06em; opacity:.75; white-space:nowrap; }
.icon-btn{ width:44px; height:44px; flex:none; border-radius:50%; display:grid; place-items:center; transition:background-color .2s; }
.icon-btn:hover{ background:color-mix(in srgb, var(--hfg) 12%, transparent); }
.icon-btn svg{ width:18px; height:18px; }
.skip{ flex:none; min-height:40px; padding:0 14px 0 16px; border-radius:999px; display:inline-flex; align-items:center; gap:6px;
  font-size:13px; font-weight:650; letter-spacing:-.005em; white-space:nowrap;
  background:var(--hfg); color:var(--hbg,#000); transition:transform .25s var(--ease-out), background-color .6s, color .6s; }
.skip:hover{ transform:translateY(-1px); }
.skip svg{ width:15px; height:15px; }
.pause-flag{ position:absolute; left:50%; top:50%; z-index:25; transform:translate(-50%,-50%) scale(.8); opacity:0; pointer-events:none;
  padding:10px 16px; border-radius:999px; font-family:var(--f-mono); font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
  background:rgba(10,8,20,.55); color:#fff; backdrop-filter:blur(8px); transition:opacity .25s, transform .35s var(--ease-out); }
.story.holding .pause-flag{ opacity:1; transform:translate(-50%,-50%) scale(1); }

/* ---------------- Contato (folha) ---------------- */
.sheet-wrap{ position:absolute; inset:0; z-index:40; visibility:hidden; }
.sheet-wrap.open{ visibility:visible; }
.sheet-bd{ position:absolute; inset:0; background:rgba(8,6,18,.55); opacity:0; transition:opacity .35s; }
.sheet-wrap.open .sheet-bd{ opacity:1; }
.sheet{ position:absolute; left:0; right:0; bottom:0; padding:14px 18px calc(22px + env(safe-area-inset-bottom)); border-radius:26px 26px 0 0;
  background:var(--paper); color:var(--ink); transform:translate3d(0,105%,0); transition:transform .55s var(--ease-out); }
.sheet-wrap.open .sheet{ transform:none; }
.sheet .grab{ width:44px; height:5px; border-radius:5px; background:rgba(22,18,31,.18); margin:0 auto 14px; }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; }
.sheet-head h3{ margin:0; font-weight:800; font-stretch:80%; font-size:28px; letter-spacing:-.03em; }
.sheet-list{ list-style:none; margin:12px 0 0; padding:0; }
.sheet-list a, .sheet-list button{ display:flex; align-items:center; gap:14px; width:100%; min-height:60px; padding:10px 4px; text-decoration:none; text-align:left;
  border-top:1px solid rgba(22,18,31,.1); }
.sheet-list .ic{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; flex:none; font-family:var(--f-mono); font-weight:600; font-size:12px; }
.sheet-list b{ display:block; font-size:16px; font-weight:700; }
.sheet-list span{ display:block; font-size:13.5px; opacity:.66; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sheet-list .go{ margin-left:auto; opacity:.5; }
.toast{ position:absolute; left:50%; bottom:24px; z-index:60; transform:translate(-50%,20px); opacity:0; padding:10px 16px; border-radius:999px; background:var(--ink); color:var(--cream); font-size:13.5px; font-weight:600; transition:all .35s var(--ease-out); pointer-events:none; }
.toast.show{ transform:translate(-50%,0); opacity:1; }

.cursor-chip{ position:fixed; left:0; top:0; z-index:90; pointer-events:none; padding:8px 13px; border-radius:999px; font-family:var(--f-mono); font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  background:var(--cream); color:var(--ink); opacity:0; transform:translate3d(-100px,-100px,0); transition:opacity .2s; white-space:nowrap; }
.cursor-chip.show{ opacity:1; }

/* ================= S1 · Abertura ================= */
.s1-sun{ position:absolute; width:86cqw; aspect-ratio:1; right:-30cqw; top:9cqh; border-radius:50%; background:var(--a1); }
.play .s1-sun{ animation:sunIn 1.4s var(--ease-out) .1s both, bob 7s ease-in-out 1.5s infinite alternate; }
@keyframes sunIn{ from{ transform:translate3d(30%,-20%,0) scale(.3); } }
@keyframes bob{ to{ transform:translate3d(-4cqw,3cqh,0) scale(1.04); } }
.s1-ring{ position:absolute; width:56cqw; right:3cqw; top:15cqh; color:var(--fg); }
.play .s1-ring{ animation:spin 22s linear infinite, fadeIn 1s ease .6s both; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.s1-ring text{ font-family:var(--f-mono); font-size:10.6px; font-weight:600; letter-spacing:.2em; fill:currentColor; }
.s1-half{ position:absolute; width:21cqw; height:42cqw; left:0; top:25cqh; border-radius:0 21cqw 21cqw 0; background:var(--a2); }
.play .s1-half{ animation:halfIn 1.3s var(--ease-out) .35s both; }
@keyframes halfIn{ from{ transform:translate3d(-100%,0,0); } }
.s1-star{ position:absolute; width:10cqw; aspect-ratio:1; left:29cqw; top:40cqh; color:var(--a2); }
.s-eyebrow > span{ display:inline-flex; align-items:center; white-space:pre; }
.play .s1-star{ animation:spin 9s linear infinite reverse, fadeIn .8s ease .9s both; }
.s1 .content{ justify-content:space-between; }
.s1-name{ margin:0; font-weight:800; font-stretch:75%; font-size:calc(18.5 * var(--u)); line-height:.86; letter-spacing:-.035em; }
.s1-name .kt{ display:block; }
.s1-name .kt + .kt{ padding-left:8cqw; }
.s1-title{ margin:3.2cqh 0 0; font-size:max(15px, calc(4.3 * var(--u))); font-weight:600; line-height:1.25; letter-spacing:-.01em; }
.s1-title em{ font-style:normal; color:var(--a2); }
.s1 .avail{ margin-top:2.2cqh; font-size:max(14px, calc(3.6 * var(--u))); max-width:none; }
.s1-cta{ display:flex; gap:10px; margin-top:2.8cqh; }
.s1-cta .btn{ flex:1; }
.s1-cta .btn-primary{ background:var(--a2); color:var(--ink); }
.s1-hint{ margin-top:2.2cqh; display:flex; align-items:center; gap:.6em; font-family:var(--f-mono); font-size:max(11px, calc(2.7 * var(--u))); letter-spacing:.1em; text-transform:uppercase; opacity:.8; }
.s1-hint i{ display:inline-block; width:2.4em; height:2px; background:currentColor; transform-origin:0 50%; }
.play .s1-hint i{ animation:hintLine 1.6s var(--ease-io) 1.8s infinite; }
@keyframes hintLine{ 0%{ transform:scaleX(0); } 50%{ transform:scaleX(1); transform-origin:0 50%; } 51%{ transform-origin:100% 50%; } 100%{ transform:scaleX(0); transform-origin:100% 50%; } }

/* ================= S2 · Carreira ================= */
.s2-aster{ position:absolute; width:44cqw; aspect-ratio:1; right:-9cqw; top:12cqh; color:var(--a1); }

// tipografia cinética: quebra em palavras/letras
function kt(text, d = 0, cls = '') {
  let ci = 0;
  const words = text.split(' ').map(w => '<span class="w">' + [...w].map(c => `<span class="ch" style="--ci:${ci++}">${esc(c)}</span>`).join('') + '</span>').join(' ');
  return `<span class="kt ${cls}" style="--d:${d}s" aria-label="${esc(text)}"><span aria-hidden="true">${words}</span></span>`;
}
// odômetro: dígitos rolam até o valor; 'from' opcional
function odo(to, d = 0, from = null) {
  const s = String(to); const f = from ? String(from) : null;
  let k = 0;
  const reel = '<span class="odo-reel">' + '01234567890123456789'.split('').map(n => `<span>${n}</span>`).join('') + '</span>';
  const parts = [...s].map((c, i) => {
    if (/\d/.test(c)) {
      const dv = +c; let fv = 0, nv = 10 + dv;
      if (f && /\d/.test(f[i])) { fv = +f[i]; nv = dv >= fv ? dv : dv + 10; }
      return `<span class="odo-d" style="--n:${nv};--f:${fv};--k:${k++}">${reel}</span>`;
    }
    return `<span class="odo-s">${esc(c)}</span>`;
  });
  return `<span class="odo" style="--d:${d}s" aria-label="${esc(s)}"><span style="display:contents" aria-hidden="true">${parts.join('')}</span></span>`;
}

  <div class="avail"><i class="live"></i><div><b>${esc(DATA.disponibilidade)}</b><br><span>${esc(DATA.local)} · ${esc(DATA.visto)}</span></div></div>
  <div class="pl-cta"><a class="btn btn-cream" href="${L.cv}" target="_blank" rel="noopener">${ICON.down} Ver CV <small>PDF</small></a><button class="btn btn-line" data-contato>Contato</button></div>
  <ul class="pl-links"><li><a href="mailto:${L.email}">${esc(L.email)}</a></li><li><a href="${L.linkedin}" target="_blank" rel="noopener">LinkedIn</a></li><li><a href="${L.github}" target="_blank" rel="noopener">GitHub</a></li></ul>`;

// painel direito (desktop)
$('#panelR').innerHTML = `
  <p class="eyebrow">Capítulos</p>
  <ol class="chapters" id="chapters">${PAL.map((p, i) => `<li><button data-go="${i}"><span>${esc(p.cap)}</span><span class="num">${String(i + 1).padStart(2, '0')}</span><span class="cbar"><i></i></span></button></li>`).join('')}</ol>
  <p class="hint"><kbd>←</kbd><kbd>→</kbd> navegar &nbsp;·&nbsp; <kbd>Espaço</kbd> pausar<br>Clique nas bordas do cartão para voltar ou avançar; segure para pausar. Avança sozinho a cada ~5&nbsp;s.</p>`;
const chapterLis = [...document.querySelectorAll('#chapters li')];
const chapterBars = chapterLis.map(li => li.querySelector('.cbar i'));

// folha de contato
$('#sheetList').innerHTML = `
  <li><a href="mailto:${L.email}"><span class="ic" style="background:#FFC94A">@</span><span style="min-width:0"><b>E-mail</b><span>${esc(L.email)}</span></span><span class="go">${ICON.arrow.replace('<svg', '<svg width="18" height="18"')}</span></a></li>
  <li><a href="${L.linkedin}" target="_blank" rel="noopener"><span class="ic" style="background:#3A36FF;color:#fff">in</span><span style="min-width:0"><b>LinkedIn</b><span>${esc(L.linkedinLabel)}</span></span><span class="go">${ICON.ext.replace('<svg', '<svg width="18" height="18"')}</span></a></li>
  <li><a href="${L.whatsapp}" target="_blank" rel="noopener"><span class="ic" style="background:#FF9BD2">wa</span><span style="min-width:0"><b>WhatsApp</b><span>${esc(L.whatsappLabel)}</span></span><span class="go">${ICON.ext.replace('<svg', '<svg width="18" height="18"')}</span></a></li>
  <li><a href="${L.github}" target="_blank" rel="noopener"><span class="ic" style="background:#16121F;color:#F7EFE3">gh</span><span style="min-width:0"><b>GitHub</b><span>${esc(L.githubLabel)}</span></span><span class="go">${ICON.ext.replace('<svg', '<svg width="18" height="18"')}</span></a></li>
  <li><button id="copyMail"><span class="ic" style="background:#FF5B3A;color:#fff">⧉</span><span><b>Copiar e-mail</b><span>para colar onde preferir</span></span></button></li>`;

/* ---------------- Estado e navegação ---------------- */
const params = new URLSearchParams(location.search);
let cur = -1, elapsed = 0, last = performance.now();
let userPaused = false, holdPaused = false, sheetOpen = false;
const autoplay = params.get('pausa') !== '1';
const root = document.documentElement;
const bgWord = $('#bgWord'), bgSpans = bgWord.querySelectorAll('span');

function setTheme(i) {
  const p = PAL[i];
  root.style.setProperty('--deep', p.deep);
  root.style.setProperty('--c1', i === 3 ? '#3A36FF' : p.bg === '#F4ECDF' ? p.a1 : p.bg);
  root.style.setProperty('--c2', p.a2 === p.fg ? p.a1 : (p.bg === '#F4ECDF' ? p.a2 : p.a1));
  card.style.setProperty('--hfg', p.fg);
  card.style.setProperty('--hbg', p.bg);
  document.querySelector('meta[name=theme-color]').content = p.bg;
  bgWord.classList.add('swap');
  clearTimeout(setTheme._t);
  setTheme._t = setTimeout(() => { const w = (p.word + ' · ').repeat(3); bgSpans.forEach(s => s.textContent = w); bgWord.classList.remove('swap'); }, 300);
  chapterLis.forEach((li, j) => li.classList.toggle('on', j === i));
  const skip = $('#skipBtn');
  skip.innerHTML = i === TOTAL - 1 ? `${ICON.replay} Rever do início` : `Pular para o resumo ${ICON.arrow}`;
  skip.setAttribute('aria-label', i === TOTAL - 1 ? 'Rever a retrospectiva do início' : 'Pular para o resumo');
}

function go(n, opt = {}) {
  n = Math.max(0, Math.min(TOTAL - 1, n));
  if (n === cur && !opt.force) return;
  const dir = n > cur ? 1 : -1;
  const next = slideEls[n], prev = slideEls[cur];
  next.style.setProperty('--ox', opt.ox ?? (cur < 0 ? '50%' : dir > 0 ? '100%' : '0%'));
  next.style.setProperty('--oy', opt.oy ?? '50%');
  if (prev && prev !== next) {
    prev.classList.remove('current', 'enter');
    prev.classList.add('leaving');
    clearTimeout(prev._t);
    prev._t = setTimeout(() => prev.classList.remove('leaving', 'play'), 900);
  }
  clearTimeout(next._t);
  next.classList.remove('leaving', 'play', 'enter', 'current');
  void next.offsetWidth;
  next.classList.add('current', 'enter', 'play');
  slideEls.forEach((s, j) => s.setAttribute('aria-hidden', j === n ? 'false' : 'true'));
  cur = n; elapsed = 0;
  barIs.forEach((b, j) => b.style.transform = `scaleX(${j < n ? 1 : 0})`);
  setTheme(n);
}

function setPausedClass() {
  const p = userPaused || holdPaused || sheetOpen;
  story.classList.toggle('paused', p);
  story.classList.toggle('holding', holdPaused);
  const pb = $('#pauseBtn');
  pb.innerHTML = userPaused ? ICON.play : ICON.pause;
  pb.setAttribute('aria-label', userPaused ? 'Continuar' : 'Pausar');
  pb.setAttribute('aria-pressed', String(userPaused));
}

function tick(now) {
  const dt = Math.min(now - last, 100); last = now;
  const paused = userPaused || holdPaused || sheetOpen || document.hidden;
  if (!paused && autoplay) {
    elapsed += dt;
    if (elapsed >= DUR[cur] && cur < TOTAL - 1) go(cur + 1);
  }
  const prog = autoplay ? Math.min(elapsed / DUR[cur], 1) : .4;
  barIs[cur].style.transform = `scaleX(${prog})`;
  if (chapterBars[cur]) chapterBars[cur].style.transform = `scaleX(${prog})`;
  requestAnimationFrame(tick);
}

/* toque / clique / segurar */
let downAt = 0, holdT = null, downX = 0, downY = 0, tracking = false;
slidesEl.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('a,button')) return;
  tracking = true; downAt = performance.now(); downX = e.clientX; downY = e.clientY;
  holdT = setTimeout(() => { holdPaused = true; setPausedClass(); updateChip(); }, 220);
});
function endPress(e, cancel) {
  if (!tracking) return; tracking = false; clearTimeout(holdT);
  if (holdPaused) { holdPaused = false; setPausedClass(); updateChip(); return; }
  if (cancel) return;
  const r = card.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const o = { ox: (x / r.width * 100).toFixed(1) + '%', oy: (y / r.height * 100).toFixed(1) + '%' };
  if (x < r.width * .3) go(cur - 1, o); else go(cur + 1, o);
}
slidesEl.addEventListener('pointerup', e => endPress(e, false));
slidesEl.addEventListener('pointercancel', e => endPress(e, true));
slidesEl.addEventListener('pointerleave', e => { if (tracking && holdPaused) endPress(e, true); });
slidesEl.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetOpen) { closeSheet(); return; }
  if (sheetOpen) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(TOTAL - 1);
  else if (e.key === ' ' && !e.target.closest('button,a')) { e.preventDefault(); userPaused = !userPaused; setPausedClass(); }
});

$('#pauseBtn').addEventListener('click', () => { userPaused = !userPaused; setPausedClass(); });
$('#skipBtn').addEventListener('click', () => {
  if (cur === TOTAL - 1) go(0, { ox: '50%', oy: '50%' });
  else go(TOTAL - 1, { ox: '88%', oy: '6%' });
});
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { const n = +g.dataset.go; go(n, { ox: n > cur ? '100%' : '0%', oy: '50%' }); }
  if (e.target.closest('[data-contato]')) openSheet();
  if (e.target.closest('[data-close]')) closeSheet();
});

/* folha de contato */
const sheet = $('#sheet');
function openSheet() { sheetOpen = true; sheet.classList.add('open'); sheet.setAttribute('aria-hidden', 'false'); setPausedClass(); setTimeout(() => sheet.querySelector('.sheet-list a')?.focus({ preventScroll: true }), 350); }
function closeSheet() { sheetOpen = false; sheet.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true'); setPausedClass(); }
$('#copyMail').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(L.email); toast('E-mail copiado'); } catch (_) { toast(L.email); }
});
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1800); }

/* cursor contextual (desktop) */
const chip = $('#chip');
const fine = matchMedia('(pointer:fine)').matches;
let chipX = -100, chipY = -100, overStage = false, lastRegion = '';
function updateChip() {
  if (!fine) return;
  chip.textContent = holdPaused ? 'Pausado' : (lastRegion === 'l' ? (cur === 0 ? 'Início' : '← Voltar') : (cur === TOTAL - 1 ? 'Fim' : 'Avançar →'));
}
if (fine) {
  slidesEl.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    const onInteractive = !!e.target.closest('a,button');
    overStage = !onInteractive;
    lastRegion = (e.clientX - r.left) < r.width * .3 ? 'l' : 'r';
    chipX = e.clientX + 16; chipY = e.clientY + 18;
    chip.style.transform = `translate3d(${chipX}px,${chipY}px,0)`;
    chip.classList.toggle('show', overStage && !sheetOpen);
    updateChip();
  });
  slidesEl.addEventListener('pointerleave', () => chip.classList.remove('show'));
}

document.addEventListener('visibilitychange', () => { last = performance.now(); });

/* ---------------- Estado inicial (parâmetros de URL) ----------------
   ?passo=N        abre direto a tela N (1–8)
   ?estado=resumo  abre o cartão-resumo (= ?passo=8)
   ?estado=contato abre a folha de contato (combina com ?passo)
   ?pausa=1        desliga o avanço automático (útil para capturas)
-------------------------------------------------------------------- */
let start = parseInt(params.get('passo'), 10);
if (params.get('estado') === 'resumo') start = TOTAL;
start = isNaN(start) ? 0 : Math.max(1, Math.min(TOTAL, start)) - 1;
setPausedClass();
go(start, { force: true, ox: '50%', oy: '50%' });
if (params.get('estado') === 'contato') setTimeout(openSheet, params.has('t') ? 0 : 500);
// ?t=S  adianta as animações da tela inicial em S segundos (capturas determinísticas)
const T = parseFloat(params.get('t'));
if (!isNaN(T)) requestAnimationFrame(() => requestAnimationFrame(() => {
  document.getAnimations().forEach(a => { try { a.currentTime = T * 1000; } catch (_) {} });
  elapsed = Math.min(T * 1000, DUR[cur] - 50);
}));
if (fine) document.querySelectorAll('.hint-t').forEach(h => h.textContent = 'Clique ou use → para começar');

requestAnimationFrame(t => { last = t; requestAnimationFrame(tick); });
</script>
</body>
</html>
